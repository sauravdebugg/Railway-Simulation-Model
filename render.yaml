services:
  - type: web
    name: freight-predict-hub-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && python -m backend.build_assets
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeployTrigger: commit
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: railway_twin
      - key: CORS_ORIGINS
        sync: false
      - key: USE_MONGOMOCK
        value: "false"
      - key: EMERGENT_LLM_KEY
        sync: false

  - type: web
    name: freight-predict-hub
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
